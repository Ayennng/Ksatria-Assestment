<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="3D people table built on the three.js CSS3D periodic table, populated from Google Sheets." />
    <title>Kasatria People Table</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='3' fill='%23000' stroke='%233A9F48' stroke-width='2'/%3E%3Ccircle cx='16' cy='13' r='5' fill='%23F7941D'/%3E%3Cpath d='M8 26c1-5 4-7 8-7s7 2 8 7' fill='%23EF3022'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <!-- Sign-in (Image A) -->
    <main id="login-view" class="login" hidden>
      <section class="login__card" aria-labelledby="login-title">
        <h1 id="login-title" class="login__title">Welcome Back</h1>
        <p class="login__subtitle">Sign in with your Google account to explore the 3D people table.</p>
        <div id="google-signin" class="login__button"></div>
        <p id="login-error" class="login__error" role="alert" hidden></p>
      </section>
    </main>

    <!-- 3D table -->
    <div id="app-view" class="app" hidden>
      <header class="topbar">
        <span class="topbar__title">People Table</span>
        <div class="topbar__user">
          <img id="user-avatar" class="topbar__avatar" alt="" referrerpolicy="no-referrer" hidden />
          <span id="user-name" class="topbar__name"></span>
          <button id="sign-out" class="btn" type="button">Sign out</button>
        </div>
      </header>

      <div id="stage" class="stage" aria-label="3D visualisation of people"></div>

      <div id="status" class="status" role="status" hidden>
        <span id="status-text"></span>
        <button id="retry" class="btn" type="button" hidden>Retry</button>
      </div>

      <nav id="menu" class="menu" aria-label="Layouts">
        <button class="btn" type="button" data-layout="table">Table</button>
        <button class="btn" type="button" data-layout="sphere">Sphere</button>
        <button class="btn" type="button" data-layout="helix">Helix</button>
        <button class="btn" type="button" data-layout="grid">Grid</button>
      </nav>

      <aside class="legend" aria-label="Net worth legend">
        <div class="legend__scale">
          <span>Low</span>
          <span class="legend__bar"></span>
          <span>High</span>
        </div>
        <ul id="legend-tiers" class="legend__tiers"></ul>
      </aside>

      <aside id="detail" class="detail" aria-live="polite" hidden>
        <button id="detail-close" class="detail__close" type="button" aria-label="Close details">×</button>
        <img id="detail-photo" class="detail__photo" alt="" />
        <div>
          <h2 id="detail-name" class="detail__name"></h2>
          <dl class="detail__facts">
            <dt>Age</dt><dd id="detail-age"></dd>
            <dt>Country</dt><dd id="detail-country"></dd>
            <dt>Interest</dt><dd id="detail-interest"></dd>
            <dt>Net worth</dt><dd id="detail-networth"></dd>
          </dl>
        </div>
      </aside>
    </div>

    <noscript>This page needs JavaScript to run.</noscript>
  </body>
</html>
